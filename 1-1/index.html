<head>

  <style>
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424;
      --accent: #e8b44b; --text: #f0f0f0; --text-sub: #888;
      --tier-s: #ff6b6b; --tier-a: #ffa94d; --tier-b: #69db7c; --tier-c: #74c0fc;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; background: none; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 60px; background: #0a0a0a; border-bottom: 1px solid #2a2a2a; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .btn-login { padding: 6px 18px; border-radius: 20px; border: 1px solid var(--accent); color: var(--accent); font-size: 0.85rem; transition: all 0.2s; }
    .btn-login:hover { background: var(--accent); color: #000; }
    .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
    .user-info span { color: var(--accent); font-weight: 600; }
    .btn-logout { padding: 4px 12px; border-radius: 12px; border: 1px solid #444; color: var(--text-sub); font-size: 0.8rem; transition: all 0.2s; }
    .btn-logout:hover { border-color: #ff6b6b; color: #ff6b6b; }

    .hero { width: 100%; height: 340px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; border-bottom: 1px solid #2a2a2a; }
    .hero h1 { font-size: 2.4rem; font-weight: 800; color: var(--accent); }
    .hero p { font-size: 1rem; color: var(--text-sub); }

    .tier-section { padding: 40px; }
    .tier-row { margin-bottom: 40px; }
    .tier-label { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .tier-badge { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; }
    .tier-badge.S { background: var(--tier-s); color: #fff; }
    .tier-badge.A { background: var(--tier-a); color: #000; }
    .tier-badge.B { background: var(--tier-b); color: #000; }
    .tier-badge.C { background: var(--tier-c); color: #000; }
    .tier-title { font-size: 1rem; color: var(--text-sub); }

    .poster-scroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
    .poster-scroll::-webkit-scrollbar { height: 4px; }
    .poster-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .poster-card { position: relative; flex-shrink: 0; width: 130px; cursor: pointer; border-radius: var(--radius); overflow: hidden; transition: transform 0.2s; }
    .poster-card:hover { transform: translateY(-4px); }
    .poster-card img { width: 130px; height: 195px; object-fit: cover; display: block; background: var(--surface2); }
    .poster-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; opacity: 0; transition: opacity 0.2s; }
    .poster-card:hover .poster-overlay { opacity: 1; }
    .overlay-rating { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .overlay-reviews { font-size: 0.75rem; color: #ccc; }
    .poster-title { padding: 6px 4px; font-size: 0.72rem; color: var(--text-sub); text-align: center; background: var(--surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border-radius: 12px; padding: 32px; width: 420px; max-width: 90vw; position: relative; }
    .modal h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--accent); }
    .modal-close { position: absolute; top: 16px; right: 20px; font-size: 1.4rem; color: var(--text-sub); cursor: pointer; }
    .modal-close:hover { color: var(--text); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--text-sub); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 14px; background: var(--surface2); border: 1px solid #333; border-radius: var(--radius); color: var(--text); font-size: 0.9rem; outline: none; transition: border 0.2s; }
    .form-group input:focus { border-color: var(--accent); }
    .btn-submit { width: 100%; padding: 11px; background: var(--accent); color: #000; font-weight: 700; border-radius: var(--radius); font-size: 0.95rem; margin-top: 6px; transition: opacity 0.2s; }
    .btn-submit:hover { opacity: 0.85; }
    .login-error { color: #ff6b6b; font-size: 0.82rem; margin-top: 8px; display: none; }
    .test-accounts { margin-top: 16px; padding: 12px; background: var(--surface2); border-radius: var(--radius); font-size: 0.78rem; color: var(--text-sub); line-height: 1.8; }
    .test-accounts strong { color: var(--text); }

    .movie-detail-header { display: flex; gap: 20px; margin-bottom: 24px; }
    .movie-detail-header img { width: 110px; height: 165px; object-fit: cover; border-radius: var(--radius); flex-shrink: 0; background: var(--surface2); }
    .movie-detail-info { flex: 1; }
    .movie-detail-info h3 { font-size: 1.2rem; margin-bottom: 8px; }
    .movie-meta { font-size: 0.82rem; color: var(--text-sub); margin-bottom: 10px; }
    .movie-synopsis { font-size: 0.85rem; color: #bbb; line-height: 1.6; max-height: 80px; overflow-y: auto; }
    .rating-row { display: flex; align-items: center; gap: 12px; margin: 14px 0; padding: 12px; background: var(--surface2); border-radius: var(--radius); }
    .avg-rating { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
    .rating-detail { font-size: 0.8rem; color: var(--text-sub); line-height: 1.8; }

    .star-rating { display: flex; gap: 4px; margin: 12px 0; }
    .star { font-size: 1.8rem; cursor: pointer; transition: transform 0.1s; }
    .star:hover { transform: scale(1.2); }
    .star.filled { color: var(--accent); }
    .star.empty { color: #444; }

    .comments-section { margin-top: 20px; }
    .comments-section h4 { font-size: 0.95rem; margin-bottom: 12px; color: var(--text); }
    .comment-item { padding: 10px; background: var(--surface2); border-radius: var(--radius); margin-bottom: 8px; font-size: 0.82rem; }
    .comment-author { color: var(--accent); font-weight: 600; }
    .comment-text { color: #bbb; margin-top: 4px; }

    .genre-btn { padding: 8px 16px; border: 1px solid #444; border-radius: 20px; background: transparent; color: var(--text); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .genre-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); }
    .genre-btn:hover { border-color: var(--accent); }

    .share-section { margin-top: 20px; padding: 12px; background: var(--surface2); border-radius: var(--radius); }
    .share-section p { font-size: 0.82rem; color: var(--text-sub); margin-bottom: 8px; }
    .btn-share { padding: 8px 16px; background: var(--accent); color: #000; border-radius: var(--radius); font-size: 0.85rem; font-weight: 600; }
    .btn-share:hover { opacity: 0.85; }

      document.getElementById('loginModal').classList.remove('open');

        localStorage.setItem('currentUser', id);
        document.getElementById('usernameDisplay').textContent = id;
        document.getElementById('guestView').style.display = 'none';
        document.getElementById('userView').style.display = 'flex';
        closeLoginModal();
        openGenreModal();
        renderTierSection();
      } else {
        showLoginError('아이디 또는 비밀번호가 올바르지 않습니다');
      }
    }

    function showLoginError(msg) {
      const err = document.getElementById('loginError');
      err.textContent = '❌ ' + msg;
      err.style.display = 'block';
    }

    function logout() {
      currentUser = null;
      selectedGenres = [];
      userRatings = {};
      localStorage.removeItem('currentUser');
      document.getElementById('guestView').style.display = 'block';
      document.getElementById('userView').style.display = 'none';
      renderTierSection();
    }

    // ===== 장르 선택 =====
    function openGenreModal() {
      const genreList = document.getElementById('genreList');
      genreList.innerHTML = '';
      GENRES.forEach(genre => {
        const btn = document.createElement('button');
        btn.className = 'genre-btn';
        btn.textContent = genre;
        btn.onclick = () => toggleGenre(genre, btn);
        genreList.appendChild(btn);
      });
      document.getElementById('genreModal').classList.add('open');
    }

    function toggleGenre(genre, btn) {
      if (selectedGenres.includes(genre)) {
        selectedGenres = selectedGenres.filter(g => g !== genre);
        btn.classList.remove('selected');
      } else {
        if (selectedGenres.length < 3) {
          selectedGenres.push(genre);
          btn.classList.add('selected');
        }
      }
    }

    function saveGenre() {
      if (selectedGenres.length === 0) {
        alert('최소 1개 이상의 장르를 선택하세요');
        return;
      }
      document.getElementById('genreModal').classList.remove('open');
      renderTierSection();
    }

    // ===== 티어 계산 =====
    function getTierByRating(rating) {
      if (rating >= 4.1) return 'S';
      if (rating >= 3.1) return 'A';
      if (rating >= 2.1) return 'B';
      return 'C';
    }

    function getMoviesByTier(tier) {
      let filtered = MOVIES;
      if (currentUser && selectedGenres.length > 0) {
        filtered = MOVIES.filter(m => selectedGenres.includes(m.genre));
      }

      if (tier === 'S') return filtered.filter(m => m.rating >= 4.1);
      if (tier === 'A') return filtered.filter(m => m.rating >= 3.1 && m.rating < 4.1);
      if (tier === 'B') return filtered.filter(m => m.rating >= 2.1 && m.rating < 3.1);
      return filtered.filter(m => m.rating < 2.1);
    }

    // ===== 티어 섹션 렌더링 =====
    function renderTierSection() {
      const section = document.getElementById('tierSection');
      section.innerHTML = '';

      if (!currentUser) {
        section.innerHTML = `
          <div style="text-align:center; padding:60px 20px; color:var(--text-sub);">
            <p style="font-size:1.1rem; margin-bottom:20px;">🔐 로그인 후 당신의 영화 취향을 정리해보세요!</p>
            <button class="btn-login" onclick="openLoginModal()" style="padding:10px 24px; font-size:1rem;">지금 로그인하기</button>
          </div>
        `;
        return;
      }

      const tiers = ['S', 'A', 'B', 'C'];
      const tierLabels = { S: 'S Tier (4.1~5.0)', A: 'A Tier (3.1~4.0)', B: 'B Tier (2.1~3.0)', C: 'C Tier (0~2.0)' };

      tiers.forEach(tier => {
        const movies = getMoviesByTier(tier);
        const tierRow = document.createElement('div');
        tierRow.className = 'tier-row';

        const label = document.createElement('div');
        label.className = 'tier-label';
        label.innerHTML = `
          <div class="tier-badge ${tier}">${tier}</div>
          <div class="tier-title">${tierLabels[tier]}</div>
        `;
        tierRow.appendChild(label);

        const scroll = document.createElement('div');
        scroll.className = 'poster-scroll';

        if (movies.length === 0) {
          scroll.innerHTML = '<p style="color:var(--text-sub); padding:20px;">이 티어에 영화가 없습니다</p>';
        } else {
          movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'poster-card';
            card.onclick = () => openMovieModal(movie);
            card.innerHTML = `
              <img src="${movie.poster}" alt="${movie.title}" />
              <div class="poster-overlay">
                <div class="overlay-rating">⭐ ${movie.rating}</div>
                <div class="overlay-reviews">리뷰 ${movie.reviews}</div>
              </div>
              <div class="poster-title">${movie.title}</div>
            `;
            scroll.appendChild(card);
          });
        }
        tierRow.appendChild(scroll);
        section.appendChild(tierRow);
      });
    }

    // ===== 영화 상세 모달 =====
    function openMovieModal(movie) {
      const content = document.getElementById('movieModalContent');
      const userRating = userRatings[movie.id] || 0;

      content.innerHTML = `
        <div class="movie-detail-header">
          <img src="${movie.poster}" alt="${movie.title}" />
          <div class="movie-detail-info">
            <h3>${movie.title}</h3>
            <div class="movie-meta">
              <div>🎬 장르: ${movie.genre}</div>
              <div>📅 평점: ${movie.rating}/5.0</div>
            </div>
            <div class="movie-synopsis">${movie.synopsis}</div>
          </div>
        </div>

        <div class="rating-row">
          <div class="avg-rating">⭐ ${movie.rating}</div>
          <div class="rating-detail">
            <div>평균 평점</div>
            <div style="font-size:0.75rem; color:#999;">리뷰 ${movie.reviews}개</div>
          </div>
        </div>

        <div>
          <h4 style="font-size:0.9rem; margin-bottom:8px; color:var(--text);">내 평점</h4>
          <div class="star-rating" id="starRating">
            ${[1,2,3,4,5].map(i => `
              <span class="star ${i <= userRating ? 'filled' : 'empty'}" onclick="rateMovie(${movie.id}, ${i})">★</span>
            `).join('')}
          </div>
        </div>

        <div class="comments-section">
          <h4>💬 리뷰</h4>
          ${(COMMENTS[movie.id] || []).map(c => `
            <div class="comment-item">
              <div class="comment-author">${c.author}</div>
              <div class="comment-text">"${c.text}"</div>
            </div>
          `).join('')}
        </div>

        <div class="share-section">
          <p>이 영화를 다른 사람과 공유하세요</p>
          <button class="btn-share" onclick="shareMovie('${movie.title}')">📤 공유하기</button>
        </div>
      `;

      document.getElementById('movieModal').classList.add('open');
    }

    function closeMovieModal() {
      document.getElementById('movieModal').classList.remove('open');
    }

    function rateMovie(movieId, rating) {
      userRatings[movieId] = rating;
      const stars = document.querySelectorAll('#starRating .star');
      stars.forEach((star, idx) => {
        if (idx < rating) {
          star.classList.add('filled');
          star.classList.remove('empty');
        } else {
          star.classList.remove('filled');
          star.classList.add('empty');
        }
      });
    }

    function shareMovie(title) {
      const text = `${currentUser}님이 "${title}"을(를) 평가했습니다! 🎬 CINETIER에서 확인해보세요!`;
      if (navigator.share) {
        navigator.share({ title: 'CINETIER', text: text });
      } else {
        // 클립보드에 복사
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('✅ 공유 텍스트가 클립보드에 복사되었습니다!');
      }
    }

    // ===== 모달 외부 클릭 시 닫기 =====
    document.addEventListener('click', (e) => {
      const loginModal = document.getElementById('loginModal');
      const movieModal = document.getElementById('movieModal');
      const genreModal = document.getElementById('genreModal');

      if (e.target === loginModal) closeLoginModal();
      if (e.target === movieModal) closeMovieModal();
      if (e.target === genreModal) {
        document.getElementById('genreModal').classList.remove('open');
      }
    });

    // ===== 초기 로드 =====
    function init() {
      const saved = localStorage.getItem('currentUser');
      if (saved && USERS[saved]) {
        currentUser = saved;
        document.getElementById('usernameDisplay').textContent = saved;
        document.getElementById('guestView').style.display = 'none';
        document.getElementById('userView').style.display = 'flex';
        renderTierSection();
      } else {
        renderTierSection();
      }
    }

    init();
  </script>
</body>
</html>
